lekiwi_imu_node:
  ros__parameters:
    # BMI160 연결 (LeKiwi 표준: Pi I2C-1, SA0=GND)
    i2c_device: /dev/i2c-1
    i2c_address: 104            # 0x68. SA0를 3.3V에 연결한 모듈은 105(0x69)
    sample_rate_hz: 100         # 25, 50, 100, 200, 400 중 하나
    accel_range_g: 2            # 2, 4, 8, 16
    gyro_range_dps: 250         # 125, 250, 500, 1000, 2000
    frame_id: imu_link
    axis_map: [1, 2, 3]         # 센서 축 → imu_link 축. 부호 있는 순열 (예: [-2, 1, 3])

    # 시작 시 자이로 바이어스(offset) 보정. 이 동안 로봇을 움직이지 않는다.
    gyro_bias_samples: 200            # 100Hz 기준 2초. 0이면 보정하지 않음
    calibration_max_gyro_std: 0.02    # [rad/s] 넘으면 움직였다고 보고 다시 수집
    reinit_after_failures: 100        # 연속 읽기 실패가 이 횟수만큼 쌓일 때마다 재초기화

    # 퍼블리시 토픽 (lekiwi/<계층>/<이름>, 워크스페이스 docs/interfaces.md)
    offset_topic: lekiwi/sensor/offset_imu      # 바이어스만 제거, 자세 없음
    lpf_topic: lekiwi/sensor/lpf_imu            # One Euro 필터 + 자세
    kf_topic: lekiwi/sensor/calibrated_imu      # 칼만 필터 + 자세

    # 공분산 (lekiwi_sensors/param/bmi160.yaml과 같은 값에서 시작)
    angular_velocity_variance: 0.0004
    linear_acceleration_variance: 0.04
    orientation_variance_roll_pitch: 0.0025
    orientation_variance_yaw: 0.05

    # 필터 선택. 기본은 One Euro만 켠다
    use_low_pass_filter: true
    use_kalman_filter: false

    # One Euro Filter (단위: 가속도 g, 각속도 deg/s). LeKiwi 100Hz 시작값이며 현장 튜닝이 필요하다.
    accel_min_cutoff: 1.0
    accel_beta: 0.1
    gyro_min_cutoff: 2.0
    gyro_beta: 0.02
    dcutoff: 1.0

    # Kalman Filter (프로세스 · 측정 노이즈 공분산. 시작값이며 현장 튜닝이 필요하다)
    Q_cov: 0.000005
    R_cov: 0.0001

    # 정지 판별 (Zero Velocity Detection)
    zero_vel_accel_threshold: 0.05    # [g] 중력을 뺀 가속도 크기
    zero_vel_gyro_threshold: 1.0      # [deg/s]
    gyro_deadband: 0.01               # [rad/s] 이보다 느린 회전은 적분하지 않음

    # RViz 확인용 자세 TF. 로봇 TF 트리(imu_link)와 겹치지 않는 별도 프레임을 쓴다.
    publish_orientation_tf: false
    orientation_tf_parent: imu_world
    orientation_tf_child: imu_orientation
