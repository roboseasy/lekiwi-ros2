# 장비별 설정 (로봇마다 다른 값). 노드 이름 아래의 값이 각 패키지 기본 설정을 덮어쓴다.
#
# 사용법: 이 파일을 ~/lekiwi_ws/robot_profile.yaml로 복사해 그 로봇에 맞게 고친다.
#   cp ~/lekiwi_ws/src/lekiwi_bringup/config/robot_profile.yaml ~/lekiwi_ws/robot_profile.yaml
# bringup.launch.py는 그 파일이 있으면 자동으로 쓴다. 다른 파일은 robot_profile:=<경로>로 준다.
#
# 이 값들은 실물 검증 전이다. 바퀴 ID · 방향 · odom 보정은 바퀴를 띄운 저속 시험과
# 줄자 실측으로 확인한 뒤 고친다.

lekiwi_motor_driver_node:
  ros__parameters:
    # Feetech 버스 어댑터. /dev/serial/by-id/ 경로를 쓰면 USB 꽂는 순서가 바뀌어도 같은 장치를 연다.
    #   ls -l /dev/serial/by-id/    # usb-1a86_USB_Single_Serial_...-if00
    port: /dev/ttyACM0
    # 바퀴 쓰기를 허용하는 모터. 아래 베이스 컨트롤러 wheel_ids와 같은 모터들이어야 한다.
    wheel_ids: [7, 8, 9]

lekiwi_base_controller_node:
  ros__parameters:
    # 모델 바퀴 left, back, right 순서의 모터 ID와 회전 방향 (+1 또는 -1)
    wheel_ids: [8, 9, 7]
    wheel_directions: [1.0, 1.0, 1.0]
    # 바퀴 · 몸체 치수 [m]
    wheel_radius: 0.05
    base_radius: 0.13647
    # 엔코더 거리 보정. 20 cm 주행 시험에서 (줄자 거리 / odom 거리)를 곱해 고친다.
    encoder_odom_scale: 1.0

lekiwi_lidar_node:
  ros__parameters:
    # YDLIDAR (CP2102 USB-UART). by-id: usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_...
    port: /dev/ttyUSB0

lekiwi_imu_node:
  ros__parameters:
    i2c_device: /dev/i2c-1
    i2c_address: 104      # 0x68. SA0를 3.3V에 연결한 모듈은 105(0x69)
    axis_map: [1, 2, 3]   # 센서 축 → imu_link 축

# 팔로워 팔 접은 자세 (lekiwi/arm/rest, bringup을 웹에서 끌 때 먼저 접는다). 로봇마다 잰다: 팔을 접고
# lekiwi/motor/states의 팔 position_ticks(ID 1~6 순서)를 적는다. 없으면 접은 자세 요청을 거절한다.
# 아래는 lekiwi04 값 (4단계 실물 시험에서 다시 잰다). 쓰려면 주석을 푼다.
# 웹 게이트웨이 보정 탭이 ~/lekiwi_ws/arm_profile.yaml에 robot_id · rest_pose_ticks를 쓰면 그 값이 여기 값을 덮는다.
# lekiwi_follower_arm_node:
#   ros__parameters:
#     rest_pose_ticks: [1787, 1230, 3190, 2636, 3235, 2002]
